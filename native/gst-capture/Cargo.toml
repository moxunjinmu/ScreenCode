[package]
name = "screencode-gst-capture"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "screencode_gst_capture"
path = "src/lib.rs"

[[bin]]
name = "screencode-gst-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
gstreamer = "0.24"
gstreamer-app = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
pretty_assertions = "1.4"
